plugins {
    id 'com.android.application' version '8.6.0'
    id 'org.jetbrains.kotlin.android' version '2.1.0'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.1.0'
}

android {
    namespace 'com.football.ar'
    compileSdk 35

    defaultConfig {
        applicationId "com.football.ar"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        // Kotlin 2.x uses the Compose Compiler Gradle plugin, not this property
        kotlinCompilerExtensionVersion '1.5.14'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    // Note: externalNativeBuild (CMake) is no longer needed.
    // The old C++ renderer (ARRenderer, ARManager, etc.) is replaced by Godot.
    // The GDExtension (dzfoot_gdext) is built separately via SCons.

    sourceSets {
        main {
            // Only include the exported .pck file in assets.
            // Do NOT include the entire godot/ directory because project.godot
            // in assets interferes with --main-pack loading.
            assets.srcDirs += ['godot/assets-pck']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.navigation:navigation-compose:2.7.7'
    implementation 'io.livekit:livekit-android:2.25.3'
    implementation 'com.google.ar:core:1.54.0'
    implementation 'io.coil-kt:coil-compose:2.6.0'
    // Godot Engine Android library
    implementation files('libs/godot-lib.4.5.1.stable.template_release.aar')
}
