0="idle"           ; ANIM_IDLE
1="walk"           ; ANIM_WALK
2="run"            ; ANIM_RUN
3="sprint"         ; ANIM_SPRINT
4="shoot_right"    ; ANIM_SHOOT_R
5="shoot_left"     ; ANIM_SHOOT_L
6="pass_short"     ; ANIM_PASS_S
7="pass_long"      ; ANIM_PASS_L
8="header"         ; ANIM_HEADER
9="tackle"         ; ANIM_TACKLE
10="dribble"       ; ANIM_DRIBBLE
11="fall"          ; ANIM_FALL
12="celebrate"     ; ANIM_CELEBRATE
13="gk_idle"       ; ANIM_GK_IDLE
14="gk_dive_left"  ; ANIM_GK_DIVE_L
15="gk_dive_right" ; ANIM_GK_DIVE_R
16="gk_catch"      ; ANIM_GK_CATCH
